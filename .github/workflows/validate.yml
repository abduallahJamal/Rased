name: validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test Rased
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run repository validator
        run: python scripts/validate.py --github-annotations

      - name: Verify CLI entry points
        run: |
          rased --version
          rased --help > /dev/null
          page-fetch --version
          pfetch --version

      - name: Run pytest suite
        run: pytest -v
